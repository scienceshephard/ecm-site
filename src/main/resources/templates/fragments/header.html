  Summer Sale for all Swim Suits And Free Delivery -OFF 50%
    <a href="/cart" class="text-decoration-none">Shop Now</a>
</header>
<nav th:fragment="header" class="navbar">
  <div class="navbar-nav">
    <h1><a href="/">Shephards✌</a></h1>
    <div class="nav-links">
      <button id="menubtn" onclick="ShowMobileNav()">
        <i class="bi bi-list" id="btn" style="font-size: 1.5rem;"></i>
      </button>
      <div class="MainLinks-default MainLinks-mobile" id="nav-links">
        <a href="/register" th:if="${username == 'anonymousUser'}">Sign-Up</a>

        <a href="/contact">Contact</a>
        <hr>
        <a href="/about">About</a>
        <hr>
        <a href="/logout" th:if="${username != 'anonymousUser' }">Logout</a>
      </div>
    </div>
    <div class="nav-icons">
      <div class="search-box">

          type="search"
          placeholder="What are you looking for?"
          class="search-input"
        />
        <a href="/" onclick="searchbox()">
          <i class="bi bi-search"></i>
        </a>
      </div>
      <a href="/favorite">
        <div class="bi bi-heart"></div>
      </a>
      <a href="/cart">
        <i class="bi bi-cart"></i>
      </a>
      <button onclick="showUserdiv()">
        <i class="bi bi-person-circle"></i>
      </button>

      <div class="User-mobile" id="user">
        <a href="/login" th:if="${username == 'anonymousUser' }">Sign in</a>

      </div>
    </div>
