<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Image Template</title>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
    const box = document.getElementById("expandableBox");
    const overlay = document.querySelector(".overlay");

    box.addEventListener("click", function () {
        box.classList.toggle("expanded");
        overlay.classList.toggle("active");
    });

    // Close when clicking outside the box
    overlay.addEventListener("click", function () {
        box.classList.remove("expanded");
        overlay.classList.remove("active");
    });
});

    </script>
    <style>
        body {
    margin: 0;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    background-color: #f0f0f0;
    transition: filter 0.3s ease;
}

/* The small box */
.small-box {
    width: 100px;
    height: 100px;
    background-color: #3498db;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.4s ease-in-out;
    border-radius: 10px;
    position: relative;
    z-index: 2;
}

/* Expanded state */
.expanded {
    width: 60%;
    height: 60vh;
    position: fixed;
    top: 20%;
    left: 20%;
    border-radius: 15px;
    z-index: 3;
}

/* Overlay for blur effect */
.overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(8px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
}

/* When active, blur the background */
.overlay.active {
    opacity: 1;
    pointer-events: all;
}

    </style>
</head>
<body>
    <div class="overlay"></div> <!-- Background blur effect -->
    
    <div class="small-box" id="expandableBox">
        Click Me
    </div>
</body>
</html>
